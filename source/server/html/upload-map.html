<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art Around - Load Map</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/marketplace/css/style.css" />
  <link rel="stylesheet" href="/marketplace/css/forms-style.css" />
</head>
<body class="artaround-theme">

  <header class="navbar site-header sticky-top px-3 mb-4">
    <div class="d-flex align-items-center">
      <a class="navbar-brand d-flex align-items-center" href="/my-museums">
        <i class="bi bi-bank me-2 text-white"></i>
        <span class="brand-text">ArtAround</span>
        <span class="brand-subtitle ms-1 text-white opacity-75">Curator</span>
      </a>
    </div>
    <a href="/my-museums" class="btn btn-sm btn-glass rounded-pill px-3">
        <i class="bi bi-x-lg me-1"></i> Annulla
    </a>
  </header>

  <div class="form-wrapper">
    <h1 class="aura-title">Carica la mappa del museo</h1>

    <form id="mapForm" class="glass-panel">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label-aura">Nome Museo</label>
          <input type="text" name="name" class="form-control input-aura" placeholder="Es: Louvre" />
        </div>
        <div class="col-md-6">
          <label class="form-label-aura">Indirizzo</label>
          <input type="text" name="address" class="form-control input-aura" placeholder="Via/Piazza..." />
        </div>
        <div class="col-md-6">
      </div>

      <div class="d-flex gap-3 divider-top pt-4">
        <button type="button" class="btn btn-gradient px-5" onclick="museumHandleSave(event)">
          Salva Museo
        </button>
        <button type="reset" class="btn btn-glass">Reset</button>
      </div>
    </form>
  </div>

  <script src="/marketplace/js/upload-map.js"></script>
</body>
</html>
