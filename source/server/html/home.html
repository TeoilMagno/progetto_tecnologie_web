<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Welcome</title>
    <link rel="icon" type="image/svg+xml" href="/shared/img/artaround-logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/marketplace/css/style.css" />
    <link rel="stylesheet" href="/marketplace/css/home.css" />
  </head>
  <body class="d-flex align-items-center justify-content-center vh-100 animated-bg overflow-hidden">
    
    <!-- Elementi decorativi di sfondo -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container text-center position-relative z-1">
      <h1 class="display-2 fw-bold mb-3 title-gradient"><i class="bi bi-bank me-3"></i>ArtAround</h1>
      <p class="lead text-light mb-5 fs-4 opacity-75">Scegli come vuoi esplorare l'arte oggi.</p>
      
      <div class="row justify-content-center g-4 mx-auto" style="max-width: 850px;">
        <!-- Card Marketplace -->
        <div class="col-md-6">
          <a href="/marketplace" class="text-decoration-none">
            <div class="card h-100 py-5 cursor-pointer glass-card card-marketplace">
              <div class="card-body">
                <div class="icon-wrapper bg-marketplace mb-4 mx-auto">
                  <i class="bi bi-shop display-4 text-white"></i>
                </div>
                <h3 class="card-title text-white fw-bold">Marketplace</h3>
                <p class="card-text text-light opacity-75 mt-3 px-3">Esplora musei, prenota visite guidate e acquista articoli esclusivi dai bookshop.</p>
              </div>
            </div>
          </a>
        </div>
        
        <!-- Card Navigator -->
        <div class="col-md-6">
          <a href="/navigator" class="text-decoration-none">
            <div class="card h-100 py-5 cursor-pointer glass-card card-navigator">
              <div class="card-body">
                <div class="icon-wrapper bg-navigator mb-4 mx-auto">
                  <i class="bi bi-compass display-4 text-white"></i>
                </div>
                <h3 class="card-title text-white fw-bold">Navigator</h3>
                <p class="card-text text-light opacity-75 mt-3 px-3">Orientati nei musei e trova le opere esposte utilizzando la mappa interattiva.</p>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
