<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art Around - Nuovo Museo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/marketplace/css/style.css" />
  <link rel="stylesheet" href="/marketplace/css/forms-style.css" />
</head>
<body class="artaround-theme">

  <header class="navbar site-header sticky-top px-3 mb-4">
    <div class="d-flex align-items-center">
      <a class="navbar-brand d-flex align-items-center" href="/my-museums">
        <i class="bi bi-bank me-2 text-white"></i>
        <span class="brand-text">ArtAround</span>
        <span class="brand-subtitle ms-1 text-white opacity-75">Curator</span>
      </a>
    </div>
    <a href="/my-museums" class="btn btn-sm btn-glass rounded-pill px-3">
        <i class="bi bi-x-lg me-1"></i> Annulla
    </a>
  </header>

  <div class="form-wrapper">
    <h1 class="aura-title">Crea un Nuovo Museo</h1>
    <p class="text-secondary mb-4 text-center">Inserisci i dati principali. Potrai aggiungere le sezioni e le opere nel passaggio successivo.</p>

    <form id="museumForm" class="glass-panel">
      <div class="row g-3">
        <!-- Dati Base -->
        <div class="col-md-6">
          <label class="form-label small text-secondary">Nome Museo *</label>
          <input type="text" class="form-control glass-input text-white" id="museum-name" required />
        </div>
        <div class="col-md-6">
          <label class="form-label small text-secondary">Indirizzo *</label>
          <input type="text" class="form-control glass-input text-white" id="museum-address" required />
        </div>
        <div class="col-md-6">
          <label class="form-label small text-secondary">Email di contatto</label>
          <input type="email" class="form-control glass-input text-white" id="museum-email" />
        </div>
        <div class="col-md-6">
          <label class="form-label small text-secondary">Telefono</label>
          <input type="text" class="form-control glass-input text-white" id="museum-phone" />
        </div>
        <div class="col-12">
          <label class="form-label small text-secondary">URL Immagine di Copertina</label>
          <input type="url" class="form-control glass-input text-white" id="museum-image" />
        </div>
        
        <div class="col-md-8">
          <label class="form-label small text-secondary">Tag (separati da virgola)</label>
          <input type="text" class="form-control glass-input text-white" id="museum-tags" placeholder="Arte, Rinascimento..." />
        </div>
        <div class="col-md-4">
          <label class="form-label small text-secondary">Prezzo Biglietto (€)</label>
          <input type="number" step="0.01" min="0" class="form-control glass-input text-white" id="museum-price" placeholder="0.00 (Gratis)" />
        </div>

        <!-- Servizi (Enum) -->
        <div class="col-12 mt-4 pt-3 border-top border-secondary border-opacity-25">
          <h6 class="text-white mb-3"><i class="bi bi-star me-2 text-info"></i>Servizi e Inclusione</h6>
          
          <label class="form-label small text-secondary mb-2">Servizi Offerti</label>
          <div class="d-flex flex-wrap gap-3 mb-3">
            <div class="form-check m-0"><input class="form-check-input srv-cb" type="checkbox" value="bathrooms" id="srv-bath"><label class="form-check-label small text-white" for="srv-bath">Bagni</label></div>
            <div class="form-check m-0"><input class="form-check-input srv-cb" type="checkbox" value="cafe" id="srv-cafe"><label class="form-check-label small text-white" for="srv-cafe">Caffetteria</label></div>
            <div class="form-check m-0"><input class="form-check-input srv-cb" type="checkbox" value="cloakroom" id="srv-cloak"><label class="form-check-label small text-white" for="srv-cloak">Guardaroba</label></div>
            <div class="form-check m-0"><input class="form-check-input srv-cb" type="checkbox" value="accessibility_ramp" id="srv-ramp"><label class="form-check-label small text-white" for="srv-ramp">Rampe Accessibilità</label></div>
            <div class="form-check m-0"><input class="form-check-input srv-cb" type="checkbox" value="wifi" id="srv-wifi"><label class="form-check-label small text-white" for="srv-wifi">Wi-Fi</label></div>
          </div>

          <label class="form-label small text-secondary mb-2">Accessibilità</label>
          <div class="d-flex flex-wrap gap-3">
            <div class="form-check m-0"><input class="form-check-input acc-cb" type="checkbox" value="wheelchair_accessible" id="acc-wheel"><label class="form-check-label small text-white" for="acc-wheel">Sedia a Rotelle</label></div>
            <div class="form-check m-0"><input class="form-check-input acc-cb" type="checkbox" value="blind_friendly" id="acc-blind"><label class="form-check-label small text-white" for="acc-blind">Ipovedenti (Audio)</label></div>
            <div class="form-check m-0"><input class="form-check-input acc-cb" type="checkbox" value="deaf_friendly" id="acc-deaf"><label class="form-check-label small text-white" for="acc-deaf">Sordi (LIS)</label></div>
            <div class="form-check m-0"><input class="form-check-input acc-cb" type="checkbox" value="dsa_friendly" id="acc-dsa"><label class="form-check-label small text-white" for="acc-dsa">DSA Friendly</label></div>
            <div class="form-check m-0"><input class="form-check-input acc-cb" type="checkbox" value="sensory_friendly" id="acc-sensory"><label class="form-check-label small text-white" for="acc-sensory">Sensory Friendly</label></div>
          </div>
        </div>

        <!-- Orari di Apertura -->
        <div class="col-12 mt-4 pt-3 border-top border-secondary border-opacity-25">
          <h6 class="text-white mb-3"><i class="bi bi-clock me-2 text-info"></i>Orari di Apertura</h6>
          <div class="row g-3" id="schedule-container"></div>
        </div>
      </div>

      <div class="d-flex gap-3 divider-top pt-4">
        <button type="button" class="btn btn-gradient w-100 py-2 fs-5" onclick="museumHandleSave(event)">
          Crea Museo e Vai all'Editor <i class="bi bi-arrow-right ms-2"></i>
        </button>
      </div>
    </form>
  </div>

  <script src="/marketplace/js/config.js"></script>
  <script src="/marketplace/js/add-museum.js"></script>
</body>
</html>
