<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Esplora Visite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/marketplace/css/style.css" />
  </head>
  <body class="artaround-theme">
    <header class="navbar site-header sticky-top px-3">
      <div class="d-flex align-items-center">
        <button class="btn text-white me-2 d-none" id="sidebarOpenBtn">
          <i class="bi bi-list fs-4"></i>
        </button>
        <a class="navbar-brand d-flex align-items-center" href="/">
          <i class="bi bi-bank me-2 text-white"></i>
          <span class="brand-text">ArtAround</span>
          <span class="brand-subtitle ms-1 text-white opacity-75">Marketplace</span>
        </a>
      </div>
      
      <div class="d-flex align-items-center">
        <button class="btn text-white position-relative me-3" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
          <i class="bi bi-cart3 fs-4"></i>
          <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 0.6rem;">
            0
          </span>
        </button>
        <div id="user-area" class="text-white small d-flex align-items-center gap-2"></div>
      </div>
    </header>

    <div class="container-fluid">
      <div class="row flex-nowrap">
        <nav id="sidebar" class="sidebar min-vh-100 pt-3"></nav>

        <main id="main-content" class="col px-md-4 pt-4 pb-5">
          <div
            class="page-header d-flex justify-content-between align-items-center pt-3 pb-4 mb-4 border-bottom border-secondary border-opacity-25"
          >
            <h1 class="h2 page-title">Visite Disponibili</h1>
          </div>

          <div
            id="public-visits-area"
            class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
          >
            <div class="col-12 text-center mt-5">
              <div class="spinner-border text-info" role="status"></div>
              <p class="mt-2 text-secondary">
                Recupero delle visite pubbliche...
              </p>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="offcanvas offcanvas-end glass-modal text-white" tabindex="-1" id="cartOffcanvas" style="background: rgba(20, 20, 30, 0.95);">
      <div class="offcanvas-header border-bottom border-secondary border-opacity-25">
        <h5 class="offcanvas-title"><i class="bi bi-cart3 me-2"></i>Il tuo Carrello</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body" id="cart-items-list"></div>
      <div class="offcanvas-footer border-top border-secondary border-opacity-25 p-3">
        <div class="d-flex justify-content-between mb-3">
          <span class="fs-5">Totale:</span>
          <span class="fs-5 fw-bold text-info" id="cart-total">€ 0.00</span>
        </div>
        <button class="btn btn-gradient w-100 py-2 fs-5" onclick="goToCheckout()">Procedi al Checkout</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/marketplace/js/config.js"></script>
    <script src="/marketplace/js/personal-area.js"></script>
    <script src="/marketplace/js/sidebar.js"></script>
    <script src="/marketplace/js/cart.js"></script> <script>
      document.addEventListener("DOMContentLoaded", async () => {
        await fetchCurrentUser();

        try {
          const res = await fetch(`${API_BASE_URL}/visits`);
          const visits = await res.json();
          const container = document.getElementById("public-visits-area");
          container.innerHTML = "";

          const publicVisits = visits.filter((v) => v.isPublic !== false);

          if (publicVisits.length === 0) {
            container.innerHTML = `<p class="text-secondary w-100 text-center">Nessuna visita pubblica disponibile al momento.</p>`;
            return;
          }

          publicVisits.forEach((visit) => {
            const coverImg =
              visit.coverImage ||
              (visit.works && visit.works.length > 0 && visit.works[0].image
                ? visit.works[0].image
                : "/img/fallback-visit.jpg");

            const safeTitle = visit.title.replace(/'/g, "\\'");

            container.innerHTML += `
              <div class="col">
                <div class="card h-100 custom-card cursor-pointer overflow-hidden" onclick="window.location.href='/visit-details?id=${visit._id}'">
                  <div style="height: 160px; overflow: hidden; position: relative;">
                    <img src="${coverImg}" class="card-img-top h-100 w-100" style="object-fit: cover;" alt="${visit.title}">
                    <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(to top, rgba(18,18,28,0.9), transparent);"></div>
                  </div>

                  <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-info mb-2">${visit.title}</h5>
                    <p class="card-text small text-secondary flex-grow-1">${visit.description || "Nessuna descrizione disponibile."}</p>
                    
                    <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top border-secondary border-opacity-25">
                      <span class="badge badge-tag"><i class="bi bi-collection me-1"></i>${visit.works ? visit.works.length : 0} Opere</span>
                      ${visit.price > 0 ? `<span class="fw-bold text-white">€ ${visit.price.toFixed(2)}</span>` : `<span class="fw-bold text-success">GRATIS</span>`}
                    </div>

                    <div class="mt-3">
                      <button class="btn btn-sm btn-gradient w-100 py-2 rounded-pill" 
                        onclick="event.stopPropagation(); addToCart({ id: '${visit._id}', type: 'visit', name: '${safeTitle}', price: ${visit.price}, image: '${coverImg}' })">
                        <i class="bi bi-cart-plus me-1"></i> Acquista Visita
                      </button>
                    </div>

                  </div>
                </div>
              </div>`;
          });
        } catch (e) {
          document.getElementById("public-visits-area").innerHTML = `<p class="text-danger w-100 text-center">Errore di caricamento.</p>`;
        }
      });
    </script>
  </body>
</html>
