<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina Non Trovata - ArtAround</title>
  <link rel="icon" type="image/svg+xml" href="/shared/img/artaround-logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/marketplace/css/style.css">
  <link rel="stylesheet" href="/marketplace/css/403.css">
</head>
<body class="artaround-theme d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="error-card glass-panel" style="max-width: 500px; width: 100%; margin: 20px; padding: 2.5rem;">
    <div class="error-icon text-info mb-4">
      <i class="bi bi-compass" style="font-size: 5rem; display: inline-block; animation: shield-pulse 2s infinite ease-in-out;"></i>
    </div>
    <h1 class="aura-title text-center mb-3">Pagina Non Trovata</h1>
    <p class="text-secondary mb-4 text-center">
      La pagina che stai cercando di raggiungere non esiste o è stata spostata. Verifica l'URL o torna alla home page.
    </p>
    
    <div class="d-grid gap-3">
      <a href="/marketplace" class="btn btn-gradient w-100 py-2 fs-5 text-center">
        <i class="bi bi-house-door me-2"></i>Torna al Marketplace
      </a>
      <button onclick="history.back()" class="btn btn-glass w-100 py-2 fs-5">
        <i class="bi bi-arrow-left me-2"></i>Torna Indietro
      </button>
    </div>
  </div>

  <script src="/marketplace/js/config.js"></script>
</body>
</html>
