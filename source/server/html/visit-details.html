<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Dettaglio Visita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/marketplace/css/visit-details.css" />
    <link rel="stylesheet" href="/marketplace/css/style.css" />
  </head>
  <body class="artaround-theme" id="visit-content-wrapper" style="display: none;">
    
    <div id="visit-banner" class="visit-banner text-white">
      <div class="visit-banner-content w-100 d-flex justify-content-between align-items-center pe-4">
        <div>
          <h1 class="h2 mb-1" id="visit-main-title">Caricamento...</h1>
          <p class="small text-opacity-75 text-white mb-0" id="visit-museum-sub"></p>
        </div>
        
        <div class="d-flex gap-2">
          <button id="edit-visit-btn" class="btn btn-warning btn-sm d-none" onclick="editVisit()">
            <i class="bi bi-pencil me-1"></i> Modifica
          </button>
          <button class="btn btn-outline-light btn-sm" onclick="goBackToVisits()">
            <i class="bi bi-arrow-left me-1"></i> Torna alle visite
          </button>
        </div>

      </div>
    </div>

    <div class="container pt-4 pb-5">
      <div class="row">
        <div class="col-12 col-lg-8 mx-auto">
          
          <div class="card custom-card p-4 mb-4">
            <h5 class="mb-3 text-white">Descrizione del percorso</h5>
            <p id="visit-description" class="text-secondary mb-0">Nessuna descrizione fornita.</p>
          </div>

          <h4 class="h5 mb-4 text-white"><i class="bi bi-list-ol me-2"></i>Le tappe del tour</h4>
          
          <ul id="visit-timeline" class="timeline-container ps-3">
             </ul>

        </div>
      </div>
      <div class="row">
        <button class="btn btn-outline-light btn-sm" onclick="startVisit()">
          <i class="me-1"></i> Inizia visita
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/marketplace/js/config.js"></script>
    <script src="/marketplace/js/visit-details.js"></script>
  </body>
</html>
