<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Dettaglio Visita</title>
    <link rel="icon" type="image/svg+xml" href="/shared/img/artaround-logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/marketplace/css/style.css" />
    <link rel="stylesheet" href="/marketplace/css/visit-details.css" />
  </head>
  <body class="artaround-theme" id="visit-content-wrapper" style="display: none;">
    
    <!-- HERO HEADER BANNER -->
    <div id="visit-banner" class="visit-banner text-white">
      <div class="visit-banner-content w-100">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 pe-md-4">
          <div>
            <span class="badge bg-info text-dark mb-2 px-3 py-1 fw-bold text-uppercase tracking-wider shadow-sm" id="visit-museum-badge" style="letter-spacing: 0.05em; border-radius: 50px;">Museo</span>
            <h1 class="display-5 mb-1" id="visit-main-title" style="font-weight: 800; text-shadow: 0 4px 10px rgba(0,0,0,0.5);">Caricamento...</h1>
            <p class="lead text-opacity-75 text-white mb-0 d-flex align-items-center gap-2" id="visit-museum-sub" style="font-size: 1.1rem;"></p>
          </div>
          
          <div class="d-flex gap-2 align-self-start align-self-md-center">
            <button id="edit-visit-btn" class="btn btn-warning d-none px-3 py-2 d-flex align-items-center gap-1" onclick="editVisit()" style="border-radius: 50px; font-weight: 600; box-shadow: 0 4px 15px rgba(255, 193, 7, 0.25);">
              <i class="bi bi-pencil-fill"></i> Modifica
            </button>
            <button class="btn btn-outline-light px-3 py-2 d-flex align-items-center gap-1" onclick="goBackToVisits()" style="border-radius: 50px; font-weight: 600; border-color: rgba(255,255,255,0.4);">
              <i class="bi bi-arrow-left"></i> Torna alle visite
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="container pt-5 pb-5">
      <div class="row g-4">
        
        <!-- COLONNA SINISTRA: DETTAGLI E TAPPE -->
        <div class="col-12 col-lg-8">
          
          <!-- DESCRIZIONE -->
          <div id="visit-description-container" class="card custom-card p-4 mb-4 d-none position-relative overflow-hidden" style="border-radius: 16px; border-left: 4px solid #0dcaf0 !important;">
            <div class="d-flex align-items-start">
              <i class="bi bi-quote fs-1 text-info opacity-25 me-3" style="line-height: 0.8; margin-top: -5px;"></i>
              <div>
                <h5 class="text-secondary small text-uppercase mb-2 fw-bold" style="letter-spacing: 0.05em;">Descrizione</h5>
                <p id="visit-description" class="text-light opacity-90 fst-italic mb-0" style="font-size: 1.05rem; line-height: 1.6;"></p>
              </div>
            </div>
          </div>

          <!-- CARATTERISTICHE EXTRA -->
          <div id="visit-metadata-container" class="card custom-card p-4 mb-4" style="border-radius: 16px;">
            <h5 class="h6 text-white mb-3 d-flex align-items-center gap-2 fw-bold" style="letter-spacing: 0.02em;">
              <i class="bi bi-info-circle text-info"></i> Informazioni sulla Visita
            </h5>
            <div class="row g-3">
              <div class="col-6 col-md-4">
                <div class="small text-secondary mb-1">Livello di Approfondimento</div>
                <div id="visit-meta-level" class="text-white fw-semibold">-</div>
              </div>
              <div class="col-6 col-md-4">
                <div class="small text-secondary mb-1">Passo / Dettaglio</div>
                <div id="visit-meta-length" class="text-white fw-semibold">-</div>
              </div>
              <div class="col-6 col-md-4" id="visit-meta-quiz-col">
                <div class="small text-secondary mb-1">Quiz Educativo</div>
                <div id="visit-meta-quiz" class="text-white fw-semibold">-</div>
              </div>
              <div class="col-12 col-md-6" id="visit-meta-audience-col">
                <div class="small text-secondary mb-1">Target di Riferimento</div>
                <div id="visit-meta-audience" class="d-flex flex-wrap gap-1 mt-1"></div>
              </div>
              <div class="col-12 col-md-6" id="visit-meta-accessibility-col">
                <div class="small text-secondary mb-1">Accessibilità / Supporto</div>
                <div id="visit-meta-accessibility" class="d-flex flex-wrap gap-1 mt-1"></div>
              </div>
            </div>
          </div>

          <!-- TAPPE -->
          <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
            <h4 class="h5 mb-0 text-white d-flex align-items-center gap-2" style="font-weight: 700;">
              <i class="bi bi-list-ol text-info fs-4"></i> Le tappe del tour
            </h4>
            <span class="badge btn-glass text-info border-info px-3 py-1 small fw-semibold animate-pulse" id="visit-stops-count">- Tappe</span>
          </div>
          
          <ul id="visit-timeline" class="timeline-container ps-3">
             <!-- Popolato dinamicamente -->
          </ul>

        </div>

        <!-- COLONNA DESTRA: BIGLIETTO / CALL TO ACTION STICKY -->
        <div class="col-12 col-lg-4">
          <div class="position-sticky" style="top: 2rem;">
            <div class="card custom-card overflow-hidden shadow-lg border border-secondary border-opacity-25" style="border-radius: 20px; background: rgba(18, 18, 24, 0.45); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);">
              
              <!-- ANTEPRIMA COPERTINA DELLA VISITA -->
              <div class="position-relative" style="height: 200px; overflow: hidden;">
                <img id="visit-sidebar-img" src="" class="w-100 h-100" style="object-fit: cover;">
                <div class="position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(to top, rgba(9, 9, 11, 0.95) 0%, rgba(9, 9, 11, 0.1) 100%);"></div>
                
                <span class="position-absolute badge bg-dark bg-opacity-75 border border-secondary border-opacity-50 text-white px-3 py-1 shadow" id="visit-sidebar-badge" style="bottom: 15px; left: 15px; font-weight: 600;">Visita Guidata</span>
              </div>

              <!-- INFO E PULSANTE -->
              <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-baseline mb-4">
                  <span class="text-secondary small fw-bold text-uppercase" style="letter-spacing: 0.05em;">Tariffa Accesso</span>
                  <span class="h3 mb-0 text-info" id="visit-sidebar-price" style="font-weight: 800;">Gratis</span>
                </div>

                <!-- STATS COMPATTE -->
                <div class="d-flex flex-column gap-3 mb-4">
                  <div class="d-flex align-items-center gap-3">
                    <div class="btn-glass d-flex align-items-center justify-content-center p-2 rounded-3 text-info" style="width: 40px; height: 40px; background: rgba(13, 202, 240, 0.05); border-color: rgba(13, 202, 240, 0.15);">
                      <i class="bi bi-clock-fill fs-5"></i>
                    </div>
                    <div>
                      <div class="small text-secondary" style="font-size: 0.75rem; line-height: 1.2;">DURATA STIMATA</div>
                      <div id="visit-sidebar-duration" class="fw-bold text-white small">- minuti</div>
                    </div>
                  </div>

                  <div class="d-flex align-items-center gap-3">
                    <div class="btn-glass d-flex align-items-center justify-content-center p-2 rounded-3 text-info" style="width: 40px; height: 40px; background: rgba(13, 202, 240, 0.05); border-color: rgba(13, 202, 240, 0.15);">
                      <i class="bi bi-geo-alt-fill fs-5"></i>
                    </div>
                    <div>
                      <div class="small text-secondary" style="font-size: 0.75rem; line-height: 1.2;">OPERE INCLUSE</div>
                      <div id="visit-sidebar-stops" class="fw-bold text-white small">- opere</div>
                    </div>
                  </div>

                  <div class="d-flex align-items-center gap-3" id="visit-sidebar-creator-row">
                    <div class="btn-glass d-flex align-items-center justify-content-center p-2 rounded-3 text-info" style="width: 40px; height: 40px; background: rgba(13, 202, 240, 0.05); border-color: rgba(13, 202, 240, 0.15);">
                      <i class="bi bi-person-fill fs-5"></i>
                    </div>
                    <div>
                      <div class="small text-secondary" style="font-size: 0.75rem; line-height: 1.2;">CREATORE</div>
                      <div id="visit-sidebar-creator" class="fw-bold text-white small">-</div>
                    </div>
                  </div>
                </div>

                <!-- GIANT CTA BUTTON -->
                <button class="btn btn-info text-dark w-100 py-3 d-flex align-items-center justify-content-center gap-2 fw-bold shadow-lg" onclick="startVisit()" style="border-radius: 50px; border: none; font-size: 1.1rem; box-shadow: 0 8px 25px rgba(13, 202, 240, 0.3) !important; transition: all 0.3s ease;">
                  <i class="bi bi-play-circle-fill fs-4"></i> Inizia la Visita
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/marketplace/js/config.js"></script>
    <script src="/marketplace/js/visit-details.js"></script>
  </body>
</html>
