<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Risultati Sessione</title>
    <link rel="icon" type="image/svg+xml" href="/shared/img/artaround-logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/marketplace/css/style.css" />
  </head>
  <body class="artaround-theme text-white">

    <header class="navbar site-header sticky-top px-3 mb-4 flex-nowrap" style="background: rgba(20, 20, 30, 0.95);">
      <!-- Tasto Indietro Desktop -->
      <a onclick="window.history.back()" class="btn d-none d-md-inline-block text-white me-2" style="cursor: pointer;">
        <i class="bi bi-arrow-left fs-4"></i>
      </a>

      <a class="navbar-brand d-flex align-items-center me-auto" href="/quiz-reports">
        <i class="bi bi-bank me-2 text-white"></i>
        <span class="brand-text">ArtAround</span>
        <span class="brand-subtitle ms-1 text-white opacity-75 d-none d-md-inline">Dettagli Sessione</span>
      </a>

      <!-- Tasto Indietro Mobile a pillola -->
      <div class="d-flex align-items-center flex-nowrap">
        <a onclick="window.history.back()" class="btn d-md-none btn-sm btn-glass rounded-pill px-3" style="cursor: pointer;">
            <i class="bi bi-arrow-left me-1"></i> Indietro
        </a>
      </div>
    </header>
    
    <div class="container py-5" style="max-width: 700px;">
      <h3 class="text-info fw-bold mb-1">Risultati Sessione</h3>
      <p class="text-secondary small mb-4" id="report-subtitle">Caricamento dettagli...</p>

      <div id="students-container" class="row g-2">
        <!-- Verrà popolato dinamicamente -->
      </div>
    </div>

    <!-- Modale Review Studente -->
    <div class="modal fade" id="studentReviewModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content glass-modal text-white border-secondary">
          <div class="modal-header border-bottom border-secondary border-opacity-25">
            <div>
              <h5 class="modal-title fw-bold text-info" id="modal-student-name">-</h5>
              <small class="text-secondary" id="modal-student-score">-</small>
            </div>
            <button type="button" class="btn-close custom-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
          </div>
          <div class="modal-body p-4" id="modal-review-body">
            <!-- Domande e correzioni -->
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/marketplace/js/config.js"></script>
    <script src="/marketplace/js/quiz-report-details.js"></script>
  </body>
</html>
