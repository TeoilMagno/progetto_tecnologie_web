<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Le mie visite</title>
    <link rel="icon" type="image/svg+xml" href="/shared/img/artaround-logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link href="/vendor/tom-select/css/tom-select.css" rel="stylesheet">
    <link rel="stylesheet" href="/marketplace/css/visits.css" />
    <link rel="stylesheet" href="/marketplace/css/style.css" />
  </head>
  <body class="artaround-theme">
    
    <header class="navbar site-header sticky-md-top px-3 flex-nowrap">
      <button class="navbar-toggler d-md-none text-white border-0 me-2 p-1 shadow-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
        <i class="bi bi-list" style="font-size: 1.8rem;"></i>
      </button>

      <!-- Tasto Indietro Desktop -->
      <a class="btn d-none back-action-btn d-md-inline-block text-white me-2">
        <i class="bi bi-arrow-left fs-4"></i>
      </a>

      <a class="navbar-brand d-flex align-items-center me-auto" href="/marketplace">
        <i class="bi bi-bank me-2 text-white"></i>
        <span class="brand-text">ArtAround</span>
        <span class="brand-subtitle ms-1 text-white opacity-75 d-none d-md-inline">Le mie visite</span>
      </a>

      <div class="d-flex align-items-center flex-nowrap">
        <search-bar class="me-3"></search-bar>

        <!-- Web Component del carrello (Desktop) -->
        <art-cart class="me-3 d-none d-md-inline-block"></art-cart>
        
        <!-- Tasto Indietro Mobile a pillola (Inserito come richiesto) -->
        <a class="btn d-md-none back-action-btn btn-sm btn-glass rounded-pill px-3 ms-2">
            <i class="bi bi-arrow-left me-1"></i> Indietro
        </a>

        <button class="btn text-white me-3 d-none d-md-inline-flex" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterSidebar">
          <i class="bi bi-funnel fs-5"></i>
        </button>

        <div id="user-area" class="user-area text-white small d-none d-md-flex align-items-center gap-2"></div>
      </div>

      <!-- Menu Mobile -->
      <div class="offcanvas-md offcanvas-start d-md-none" tabindex="-1" id="mobileMenu" style="background: rgba(20, 20, 30, 0.95); z-index: 1050;">
        <div class="offcanvas-header border-bottom border-secondary border-opacity-25">
          <h5 class="offcanvas-title text-white">Menu</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#mobileMenu"></button>
        </div>
        <div class="offcanvas-body p-4 d-flex flex-column align-items-start gap-4">
          <art-cart btn-class="btn text-white d-flex align-items-center w-100 text-start" icon-class="bi bi-cart3 fs-5 me-3" label="Carrello"></art-cart>
          <button class="btn text-white d-flex align-items-center w-100 text-start" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterSidebar">
            <i class="bi bi-funnel fs-5 me-3"></i>Filtri
          </button>
          <div class="user-area text-white small d-flex flex-column align-items-start gap-3 w-100 mt-2"></div>
        </div>
      </div>
    </header>

    <div class="container-fluid">
      <div class="row flex-nowrap">
        
        <main id="main-content" class="col px-md-4 pt-4 pb-5">
          <div class="page-header d-flex justify-content-between align-items-center pt-3 pb-4 mb-4 border-bottom">
            <h1 class="h2 page-title" id="page-title">Le mie visite</h1>
            

            <a href="/create-visit" class="btn btn-sm btn-gradient px-3">
              <i class="bi bi-plus-circle me-1"></i> Nuova visita
            </a>

          </div>

          <div id="managed-visits-area" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col-12 text-center mt-5">
              <div class="spinner-border text-light" role="status"></div>
              <p class="mt-2 text-secondary">Recupero delle tue visite...</p>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Pannello Laterale Filtri (Spostato qui) -->
    <div class="offcanvas offcanvas-start glass-modal text-white pt-3 px-3" tabindex="-1" id="filterSidebar" aria-labelledby="filterSidebarLabel" style="background-color: #121216 !important; width: 300px;">
    </div>

    <!-- Pannello Laterale Carrello (Mancante) -->
    <div class="offcanvas offcanvas-end glass-modal text-white" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel" style="background-color: #121216 !important;">
      <div class="offcanvas-header border-bottom border-secondary border-opacity-25">
        <h5 class="offcanvas-title fw-bold" id="cartOffcanvasLabel"><i class="bi bi-cart3 me-2 text-info"></i>Il tuo Carrello</h5>
        <button type="button" class="btn-close custom-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column">
        <div id="cart-items-list" class="flex-grow-1 overflow-auto pe-1">
          <!-- Gli elementi del carrello verranno iniettati qui da cart.js -->
        </div>
        <div class="border-top border-secondary border-opacity-25 pt-3 mt-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-secondary small fw-bold uppercase">Totale:</span>
            <span class="fs-5 text-info fw-bold" id="cart-total">€ 0.00</span>
          </div>
          <button class="btn btn-gradient w-100 py-2" onclick="goToCheckout()">
            Procedi all'acquisto <i class="bi bi-arrow-right ms-1"></i>
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/vendor/tom-select/js/tom-select.complete.min.js"></script>
    <script src="/vendor/imask/imask.js"></script>
    <script src="/marketplace/js/config.js"></script>
    <script src="/marketplace/js/webcomponents/art-cart.js"></script>
    <script src="/marketplace/js/webcomponents/search-bar.js"></script>
    <script src="/marketplace/js/filters.js"></script>
    <script src="/marketplace/js/sidebar.js"></script>
    <script src="/marketplace/js/visits-ui.js"></script>
  </body>
</html>
