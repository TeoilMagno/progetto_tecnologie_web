<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Le mie visite</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <link rel="stylesheet" href="/marketplace/css/visits.css" />
    <link rel="stylesheet" href="/marketplace/css/style.css" />
  </head>
  <body class="artaround-theme">
    
    <header class="navbar site-header sticky-top px-3">
      <div class="d-flex align-items-center">
        <button class="btn text-white me-2 d-none" id="sidebarOpenBtn">
          <i class="bi bi-list fs-4"></i>
        </button>
        <a class="navbar-brand d-flex align-items-center" href="/">
          <i class="bi bi-bank me-2 text-white"></i>
          <span class="brand-text">ArtAround</span>
          <span class="brand-subtitle ms-1 text-white opacity-75">Marketplace</span>
        </a>
      </div>
      
      <div class="d-flex align-items-center">
        <!-- Bottone Filtri -->
        <button class="btn text-white me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterSidebar">
          <i class="bi bi-funnel fs-5"></i>
        </button>

        <!-- Bottone Carrello -->
        <button class="btn text-white position-relative me-3" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
          <i class="bi bi-cart3 fs-4"></i>
          <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 0.6rem;">
            0
          </span>
        </button>

        <div id="user-area" class="text-white small d-flex align-items-center gap-2"></div>
      </div>
    </header>

    <div class="container-fluid">
      <div class="row flex-nowrap">
        
        <main id="main-content" class="col px-md-4 pt-4 pb-5">
          <div class="page-header d-flex justify-content-between align-items-center pt-3 pb-4 mb-4 border-bottom">
            <h1 class="h2 page-title" id="page-title">Le mie visite</h1>
            
            <div class="d-flex gap-2">
              <a href="/" class="btn btn-sm btn-glass px-3">
                <i class="bi bi-arrow-left me-1"></i> Marketplace
              </a>
              <a href="/create-visit" class="btn btn-sm btn-gradient px-3">
                <i class="bi bi-plus-circle me-1"></i> Nuova visita
              </a>
            </div>
          </div>

          <div id="managed-visits-area" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col-12 text-center mt-5">
              <div class="spinner-border text-light" role="status"></div>
              <p class="mt-2 text-secondary">Recupero delle tue visite...</p>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Pannello Laterale Filtri (Spostato qui) -->
    <div class="offcanvas offcanvas-start glass-modal text-white pt-3 px-3" tabindex="-1" id="filterSidebar" aria-labelledby="filterSidebarLabel" style="background-color: #121216 !important; width: 300px;">
    </div>

    <!-- Pannello Laterale Carrello (Mancante) -->
    <div class="offcanvas offcanvas-end glass-modal text-white" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel" style="background-color: #121216 !important;">
      <div class="offcanvas-header border-bottom border-secondary border-opacity-25">
        <h5 class="offcanvas-title fw-bold" id="cartOffcanvasLabel"><i class="bi bi-cart3 me-2 text-info"></i>Il tuo Carrello</h5>
        <button type="button" class="btn-close custom-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column">
        <div id="cart-items-list" class="flex-grow-1 overflow-auto pe-1">
          <!-- Gli elementi del carrello verranno iniettati qui da cart.js -->
        </div>
        <div class="border-top border-secondary border-opacity-25 pt-3 mt-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-secondary small fw-bold uppercase">Totale:</span>
            <span class="fs-5 text-info fw-bold" id="cart-total">€ 0.00</span>
          </div>
          <button class="btn btn-gradient w-100 py-2" onclick="goToCheckout()">
            Procedi all'acquisto <i class="bi bi-arrow-right ms-1"></i>
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    <script src="https://unpkg.com/imask"></script>
    <script src="/marketplace/js/config.js"></script>
    <script src="/marketplace/js/cart.js"></script>
    <script src="/marketplace/js/search-bar.js"></script>
    <script src="/marketplace/js/filters.js"></script>
    <script src="/marketplace/js/sidebar.js"></script>
    <script src="/marketplace/js/visits-ui.js"></script>
    <script src="/marketplace/js/personal-area.js"></script>
    <script>
      // Inizializza il caricamento delle visite
      document.addEventListener("DOMContentLoaded", async () => {
        await fetchCurrentUser();

        getMyVisits(); 
      });

      // intercetta il tasto "Indietro"
      window.addEventListener("pageshow", (event) => {
        // Se la pagina viene dalla cache (tasto indietro) E c'è il post-it di aggiornamento
        if (event.persisted && localStorage.getItem("visitsChanged") === "true") {
            console.log("Rilevate nuove modifiche, aggiorno i dati...");
            getMyVisits(); 
            
            // Strappiamo il post-it, così se torna indietro un'altra volta non ricarica inutilmente!
            localStorage.removeItem("visitsChanged");
        }
      });
    </script>
  </body>
</html>
