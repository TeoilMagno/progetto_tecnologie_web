<!DOCTYPE HTML>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Around - Aggiungi opere</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/marketplace/css/style.css">
  <link rel="stylesheet" href="/marketplace/css/forms-style.css">
</head>
<body class="artaround-theme">

  <header class="navbar site-header sticky-top px-3 mb-4">
    <div class="d-flex align-items-center">
      <a class="navbar-brand d-flex align-items-center" href="/my-museums">
        <i class="bi bi-bank me-2 text-white"></i>
        <span class="brand-text">ArtAround</span>
      </a>
    </div>
  </header>

  <div class="form-wrapper">
    <h1 class="aura-title">Aggiungi opere alla sezione</h1>
    
    <form action="/api/add-work" id="main-form/marketplace" class="glass-panel">
      <div id="works-container-1" class="mb-4"></div>

      <button type="button" class="btn btn-glass w-100 mb-4 text-info" onclick="renderAddWork(1)">
        <i class="bi bi-plus-circle me-2"></i>Aggiungi un'altra opera
      </button>

      <div class="d-flex gap-3 divider-top pt-4">
        <button type="button" class="btn btn-gradient px-5" onclick="handleSave()">Salva tutto</button>
      </div>
    </form>
  </div>

  <script src="/marketplace/js/add-work.js"></script>
  <script>
    window.onload = () => {
        renderAddWork(1); 
    };
  </script>
</body>
</html>
