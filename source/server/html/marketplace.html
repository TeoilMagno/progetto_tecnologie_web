<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Marketplace</title>
    <link rel="icon" type="image/svg+xml" href="/shared/img/artaround-logo.svg">  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/marketplace/css/style.css?v=3" />
  </head>
  <body class="artaround-theme custom-scrollbar">
    
    <header class="navbar site-header sticky-md-top px-3 flex-nowrap">
      <button class="navbar-toggler d-md-none text-white border-0 me-2 p-1 shadow-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
        <i class="bi bi-list" style="font-size: 1.8rem;"></i>
      </button>

      <a class="navbar-brand d-flex align-items-center me-auto" href="/marketplace">
        <i class="bi bi-bank me-2 text-white"></i>
        <span class="brand-text">ArtAround</span>
        <span class="brand-subtitle ms-1 text-white opacity-75 d-none d-md-inline">Marketplace</span>
      </a>

      <div class="d-flex align-items-center flex-nowrap">
        <!-- Sempre visibili (mobile e desktop): una sola istanza di ciascuna, per non duplicare id -->
        <search-bar class="me-2"></search-bar>

        <!-- Solo desktop: su mobile finiscono nell'hamburger qui sotto -->
        <a href="/navigator" class="btn text-white me-3 d-none d-md-inline-flex" title="Apri Navigator">
          <i class="bi bi-compass fs-5"></i>
        </a>
        <button class="btn text-white me-3 d-none d-md-inline-flex" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterSidebar">
          <i class="bi bi-funnel fs-5"></i>
        </button>

        <art-cart></art-cart>

        <div class="user-area text-white small d-none d-md-flex align-items-center gap-2"></div>
      </div>

      <!-- Solo mobile: Navigator, Filtri e area utente, dietro l'hamburger -->
      <div class="offcanvas-md offcanvas-start d-md-none" tabindex="-1" id="mobileMenu" style="background: rgba(20, 20, 30, 0.95); z-index: 1050;">
        <div class="offcanvas-header border-bottom border-secondary border-opacity-25">
          <h5 class="offcanvas-title text-white">Menu</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#mobileMenu"></button>
        </div>
        <div class="offcanvas-body p-4 d-flex flex-column align-items-start gap-4">
          <art-cart btn-class="btn text-white d-flex align-items-center w-100 text-start" icon-class="bi bi-cart3 fs-5 me-3" label="Carrello"></art-cart>

          <a href="/navigator" class="btn text-white d-flex align-items-center" title="Apri Navigator" data-bs-dismiss="offcanvas" data-bs-target="#mobileMenu">
            <i class="bi bi-compass fs-5 me-3"></i>Navigator
          </a>
          <button id="mobile-filtri-btn" class="btn text-white d-flex align-items-center" type="button" data-bs-dismiss="offcanvas" data-bs-target="#mobileMenu">
            <i class="bi bi-funnel fs-5 me-3"></i>Filtri
          </button>
          <div class="user-area text-white small d-flex flex-column align-items-start gap-3 w-100 mt-2"></div>
        </div>
      </div>
    </header>

    <div class="container-fluid">
      <div class="row flex-nowrap">
        <nav id="filterSidebar" class="offcanvas offcanvas-start glass-modal text-white pt-3 px-3 border-end border-secondary border-opacity-25" tabindex="-1" style="width: 300px; background: rgba(20, 20, 30, 0.95);"></nav>

        <main id="main-content" class="col custom-scrollbar px-md-4 pt-4 pb-5">
          <div class="page-header d-flex justify-content-between align-items-center pt-3 pb-4 mb-4 border-bottom">
            <h1 class="h2 page-title" id="page-title">Musei Disponibili</h1>
            <a href="/marketplace" id="back-btn" class="btn btn-sm btn-glass d-none">
              <i class="bi bi-arrow-left me-1"></i> Indietro
            </a>
          </div>

          <div id="content-area" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/marketplace/js/config.js"></script>
    <script src="/marketplace/js/filters.js"></script>
    <script src="/marketplace/js/sidebar.js"></script>
    <script src="/marketplace/js/marketplace.js"></script>
    <script src="/marketplace/js/webcomponents/search-bar.js"></script>
    <script src="/marketplace/js/webcomponents/art-cart.js"></script>
  </body>
</html>
