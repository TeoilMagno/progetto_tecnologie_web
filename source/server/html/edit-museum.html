<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Gestione Museo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="artaround-theme">
    <header class="navbar site-header sticky-top px-3">
      <div class="d-flex align-items-center">
        <a class="btn text-white me-2" href="/my-museums">
          <i class="bi bi-arrow-left fs-4"></i>
        </a>
        <a class="navbar-brand d-flex align-items-center" href="/">
          <i class="bi bi-bank me-2 text-white"></i>
          <span class="brand-text">ArtAround</span>
          <span class="brand-subtitle ms-1 text-white opacity-75">Editor Museo</span>
        </a>
      </div>
      <div id="user-area" class="text-white small d-flex align-items-center gap-2"></div>
    </header>

    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary border-opacity-25 pb-3">
        <div>
          <h1 class="h3 text-info mb-1" id="editor-title">Modifica Museo</h1>
          <p class="small text-secondary mb-0">Aggiorna le informazioni del museo, le sue sezioni e le opere esposte.</p>
        </div>
        <button class="btn btn-success" onclick="saveAllMuseumChanges()">
          <i class="bi bi-check-lg me-1"></i> Salva Modifiche Museo
        </button>
      </div>

      <div class="card custom-card mb-4">
        <div class="card-header bg-transparent border-bottom border-secondary border-opacity-25 pt-3">
          <h5 class="h6 text-white mb-0"><i class="bi bi-info-circle me-2"></i>Informazioni Generali</h5>
        </div>
        <div class="card-body">
          <form id="museum-info-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small text-secondary">Nome Museo</label>
                <input type="text" class="form-control glass-input text-white" id="museum-name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label small text-secondary">Indirizzo</label>
                <input type="text" class="form-control glass-input text-white" id="museum-address" required />
              </div>
              <div class="col-md-6">
                <label class="form-label small text-secondary">Email di contatto</label>
                <input type="email" class="form-control glass-input text-white" id="museum-email" />
              </div>
              <div class="col-md-6">
                <label class="form-label small text-secondary">Telefono</label>
                <input type="text" class="form-control glass-input text-white" id="museum-phone" />
              </div>
              <div class="col-12">
                <label class="form-label small text-secondary">URL Immagine di Copertina</label>
                <input type="url" class="form-control glass-input text-white" id="museum-image" />
              </div>
              <div class="col-12">
                <label class="form-label small text-secondary">Tag (separati da virgola)</label>
                <input type="text" class="form-control glass-input text-white" id="museum-tags" placeholder="Arte, Rinascimento, Firenze" />
              </div>
            </div>
          </form>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="h5 text-white mb-0"><i class="bi bi-journal-album me-2"></i>Sezioni ed Opere</h4>
        <button class="btn btn-sm btn-outline-info" onclick="addNewSectionPrompt()">
          <i class="bi bi-plus-lg me-1"></i> Aggiungi Nuova Sezione
        </button>
      </div>

      <div class="accordion custom-accordion mb-5" id="sectionsAccordion">
        <div class="text-center py-4 text-secondary" id="accordion-loading">
          <div class="spinner-border spinner-border-sm text-info"></div> Caricamento sezioni...
        </div>
      </div>
    </div>

    <div class="modal fade" id="workModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content glass-modal text-white">
          <div class="modal-header border-bottom-custom">
            <h5 class="modal-title" id="workModalLabel">Gestisci Opera</h5>
            <button type="button" class="btn-close custom-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="work-form">
              <input type="hidden" id="work-id" />
              <input type="hidden" id="work-section-id" />
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small text-secondary">Titolo Opera *</label>
                  <input type="text" class="form-control glass-input" id="work-name" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label small text-secondary">Artista / Autore</label>
                  <input type="text" class="form-control glass-input" id="work-author" />
                </div>
                <div class="col-md-6">
                  <label class="form-label small text-secondary">Anno / Periodo</label>
                  <input type="text" class="form-control glass-input" id="work-year" />
                </div>
                <div class="col-md-6">
                  <label class="form-label small text-secondary">Stile / Movimento</label>
                  <input type="text" class="form-control glass-input" id="work-style" />
                </div>
                <div class="col-12">
                  <label class="form-label small text-secondary">URL Immagine</label>
                  <input type="url" class="form-control glass-input" id="work-image" />
                </div>
                <div class="col-12">
                  <label class="form-label small text-secondary">Descrizione Culturale</label>
                  <textarea class="form-control glass-input" id="work-description" rows="3"></textarea>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer border-top-custom">
            <button type="button" class="btn btn-glass px-3" data-bs-dismiss="modal">Annulla</button>
            <button type="button" class="btn btn-gradient px-3" onclick="saveWorkFromModal()">Salva Opera</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/personal-area.js"></script>
    <script src="/js/edit-museum.js"></script>
  </body>
</html>1
