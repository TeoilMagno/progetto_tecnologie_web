<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Adozioni Opere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <link rel="stylesheet" href="/marketplace/css/style.css" />
    <link rel="stylesheet" href="/marketplace/css/search-bar.css" />
  </head>
  <body class="artaround-theme">
    
    <header class="navbar site-header sticky-top px-3">
      <div class="d-flex align-items-center">
        <a class="btn text-white me-2" href="/my-museums">
          <i class="bi bi-arrow-left fs-4"></i>
        </a>
        <a class="navbar-brand d-flex align-items-center" href="/">
          <i class="bi bi-bank me-2 text-white"></i>
          <span class="brand-text">ArtAround</span>
          <span class="brand-subtitle ms-1 text-white opacity-75">Gestione Adozioni</span>
        </a>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="search-container position-relative d-flex align-items-center" id="search-container">
          <input type="text" id="adoptions-search-input" class="search-input form-control bg-transparent text-white border-0" placeholder="Cerca opera o museo...">
          <button class="btn text-white" id="search-toggle-btn">
            <i class="bi bi-search fs-5"></i>
          </button>
        </div>
        <div id="user-area" class="text-white small d-flex align-items-center gap-2"></div>
      </div>
    </header>

    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary border-opacity-25 pb-3">
        <div>
          <h1 class="h3 text-info mb-1"><i class="bi bi-arrow-left-right me-2"></i>Adozioni & Prestiti Opere</h1>
          <p class="small text-secondary mb-0">Gestisci i prestiti temporanei delle opere d'arte tra i tuoi musei e altri istituti.</p>
        </div>
        <button class="btn btn-gradient" onclick="openNewAdoptionModal()">
          <i class="bi bi-plus-circle me-1"></i> Richiedi Nuova Adozione
        </button>
      </div>

      <ul class="nav nav-tabs custom-tabs mb-4 border-secondary border-opacity-25" id="adoptionsTabs" role="tablist">
        <li class="nav-item">
          <button class="nav-link active text-white" id="incoming-tab" data-bs-toggle="tab" data-bs-target="#incoming" type="button">
            <i class="bi bi-inbox me-2"></i>Richieste Ricevute (In Entrata)
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link text-white" id="outgoing-tab" data-bs-toggle="tab" data-bs-target="#outgoing" type="button">
            <i class="bi bi-send me-2"></i>Richieste Inviate (In Uscita)
          </button>
        </li>
      </ul>

      <div class="tab-content" id="adoptionsTabContent">
        <div class="tab-pane fade show active" id="incoming" role="tabpanel">
          <div id="incoming-container" class="row row-cols-1 row-cols-md-2 g-3">
            <div class="text-center py-5 col-12 text-secondary">
              <div class="spinner-border text-info"></div> Caricamento...
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="outgoing" role="tabpanel">
          <div id="outgoing-container" class="row row-cols-1 row-cols-md-2 g-3">
            <div class="text-center py-5 col-12 text-secondary">
              <div class="spinner-border text-info"></div> Caricamento...
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="newAdoptionModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content glass-modal text-white">
          <div class="modal-header border-bottom-custom">
            <h5 class="modal-title"><i class="bi bi-plus-circle me-2 text-info"></i>Richiedi Opera in Adozione</h5>
            <button type="button" class="btn-close custom-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="adoption-form">
              <div class="row g-3">
                
                <div class="col-md-6">
                  <label class="form-label small text-secondary">Museo Proprietario dell'Opera *</label>
                  <select id="source-museum-select" placeholder="Caricamento musei..." required></select>
                </div>

                <div class="col-md-6">
                  <label class="form-label small text-secondary">Opera da Richiedere *</label>
                  <select id="work-select" placeholder="Prima seleziona un museo..." required></select>
                </div>

                <div class="col-12">
                  <label class="form-label small text-secondary">Tuo Museo che Ospiterà l'Opera *</label>
                  <select id="target-museum-select" placeholder="Caricamento musei..." required></select>
                </div>

                <div class="mb-3">
                  <label class="form-label text-secondary small">Stanza di esposizione</label>
                  <select id="target-room-select" placeholder="Prima seleziona il tuo museo..."></select>
                </div>

                <div class="col-md-6">
                  <label class="form-label small text-secondary">Data Inizio Prestito *</label>
                  <input type="text" class="form-control glass-input text-white" id="begin-date-input" placeholder="Seleziona data..." required />
                </div>
                <div class="col-md-6">
                  <label class="form-label small text-secondary">Data Fine Prestito *</label>
                  <input type="text" class="form-control glass-input text-white" id="end-date-input" placeholder="Seleziona data..." required />
                </div>

              </div>
            </form>
          </div>
          <div class="modal-footer border-top-custom">
            <button type="button" class="btn btn-glass px-3" data-bs-dismiss="modal">Annulla</button>
            <button type="button" class="btn btn-gradient px-3" onclick="submitAdoptionRequest()">Invia Richiesta</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    <script src="https://unpkg.com/imask"></script>
    <script src="/marketplace/js/config.js"></script>
    <script src="/marketplace/js/personal-area.js"></script>
    <script src="/marketplace/js/search-bar.js"></script>
    <script src="/marketplace/js/my-adoptions.js"></script>
  </body>
</html>
