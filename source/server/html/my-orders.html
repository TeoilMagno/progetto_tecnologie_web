<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - I Miei Ordini</title>
    <link rel="icon" type="image/svg+xml" href="/shared/img/artaround-logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/marketplace/css/style.css" />
    <link rel="stylesheet" href="/marketplace/css/search-bar.css" />
  </head>
  <body class="artaround-theme">
    
    <header class="navbar site-header sticky-md-top px-3 flex-nowrap">
      <button class="navbar-toggler d-md-none text-white border-0 me-2 p-1 shadow-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
        <i class="bi bi-list" style="font-size: 1.8rem;"></i>
      </button>

      <button class="btn d-none d-md-inline-block text-white me-2" onclick="window.history.back()" title="Torna Indietro" style="background: transparent; border: none;">
        <i class="bi bi-arrow-left fs-4"></i>
      </button>

      <a class="navbar-brand d-flex align-items-center me-auto" href="/marketplace">
        <i class="bi bi-bank me-2 text-white"></i>
        <span class="brand-text">ArtAround</span>
        <span class="brand-subtitle ms-1 text-white opacity-75 d-none d-md-inline">I Miei Ordini</span>
      </a>

      <div class="d-flex align-items-center flex-nowrap">
        <search-bar class="me-3"></search-bar>

        <!-- Web Component del carrello (Desktop) -->
        <!-- Carrello Mobile -->
        <art-cart class="me-3 d-none d-md-inline-block"></art-cart>

        <div class="user-area text-white small d-none d-md-flex align-items-center gap-2"></div>

        <a href=`window.history.back()` class="btn d-md-none btn-sm btn-glass rounded-pill px-3">
            <i class="bi bi-arrow-left me-1"></i> Indietro
        </a>
      </div>

      <!-- Menu Mobile -->
      <div class="offcanvas-md offcanvas-start d-md-none" tabindex="-1" id="mobileMenu" style="background: rgba(20, 20, 30, 0.95); z-index: 1050;">
        <div class="offcanvas-header border-bottom border-secondary border-opacity-25">
          <h5 class="offcanvas-title text-white">Menu</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#mobileMenu"></button>
        </div>
        <div class="offcanvas-body p-4 d-flex flex-column align-items-start gap-4">
          <art-cart btn-class="btn text-white d-flex align-items-center w-100 text-start" icon-class="bi bi-cart3 fs-5 me-3" label="Carrello"></art-cart>
          <div class="user-area text-white small d-flex flex-column align-items-start gap-3 w-100 mt-2"></div>
        </div>
      </div>
    </header>

    <div class="container py-5" style="max-width: 800px;">
      <h2 class="mb-4 text-white"><i class="bi bi-receipt me-2 text-info"></i>Storico Acquisti</h2>
      
      <div id="orders-container" class="d-flex flex-column gap-4">
        <div class="text-center py-5">
          <div class="spinner-border text-info" role="status"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/marketplace/js/config.js"></script>
    <script src="/marketplace/js/webcomponents/search-bar.js"></script>
    <script src="/marketplace/js/webcomponents/art-cart.js"></script>
    <script src="/marketplace/js/my-orders.js"></script>
  </body>
</html>
