<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Marketplace</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/marketplace/css/style.css?v=3" />
  </head>
  <body class="artaround-theme">
    
    <header class="navbar site-header sticky-top px-3">
      <div class="d-flex align-items-center">
        <button class="btn text-white me-2 d-none" id="sidebarOpenBtn">
          <i class="bi bi-list fs-4"></i>
        </button>
        <a class="navbar-brand d-flex align-items-center" href="#">
          <i class="bi bi-bank me-2 text-white"></i>
          <span class="brand-text">ArtAround</span>
          <span class="brand-subtitle ms-1 text-white opacity-75">Marketplace</span>
        </a>
      </div>

      <div id="user-area" class="text-white small d-flex align-items-center gap-2"></div>
    </header>

    <div class="container-fluid">
      <div class="row flex-nowrap">
        <nav id="sidebar" class="sidebar pt-3"></nav>

        <main id="main-content" class="col px-md-4 pt-4 pb-5">
          <div class="page-header d-flex justify-content-between align-items-center pt-3 pb-4 mb-4 border-bottom">
            <h1 class="h2 page-title" id="page-title">Musei Disponibili</h1>
            <button id="back-btn" class="btn btn-sm btn-glass d-none" onclick="history.back()">
              <i class="bi bi-arrow-left me-1"></i> Indietro
            </button>
          </div>

          <div id="content-area" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
        </main>
      </div>
    </div>

    <div class="modal fade" id="editItemModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content glass-modal">
          <div class="modal-header border-bottom-custom">
            <h5 class="modal-title fw-bold">Modifica Opera</h5>
            <button type="button" class="btn-close custom-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="editForm">
              <input type="hidden" id="itemId" />
              <div class="row mb-3">
                <div class="col-md-8">
                  <label for="itemName" class="form-label text-secondary small">Titolo</label>
                  <input type="text" class="form-control glass-input" id="itemName" />
                </div>
                <div class="col-md-4">
                  <label for="itemPrice" class="form-label text-secondary small">Prezzo</label>
                  <input type="number" step="0.01" class="form-control glass-input" id="itemPrice" />
                </div>
              </div>
              <div class="mb-3">
                <label for="itemDescription" class="form-label text-secondary small">Descrizione</label>
                <textarea class="form-control glass-input" id="itemDescription" rows="4"></textarea>
              </div>
              <h6 class="metadata-title pb-2 mb-3 mt-4 text-secondary text-uppercase small">
                Metadati
              </h6>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label text-secondary small">Durata</label>
                  <select class="form-select glass-input" id="itemDuration">
                    <option value="1min">1 Minuto</option>
                    <option value="3s">3 Secondi</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label text-secondary small">Tono</label>
                  <select class="form-select glass-input" id="itemTone">
                    <option value="medio">Medio</option>
                    <option value="infantile">Infantile</option>
                  </select>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer border-top-custom">
            <button type="button" class="btn btn-glass" data-bs-dismiss="modal">Annulla</button>
            <button type="button" class="btn btn-gradient" onclick="saveItem()">Salva Modifiche</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/marketplace/js/personal-area.js"></script>
    <script src="/marketplace/js/marketplace.js"></script>
    <script src="/marketplace/js/sidebar.js"></script>
  </body>
</html>
