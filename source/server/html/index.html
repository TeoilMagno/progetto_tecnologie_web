<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Marketplace</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/marketplace/css/style.css?v=3" />
    <link rel="stylesheet" href="/marketplace/css/search-bar.css" />
  </head>
  <body class="artaround-theme">
    
    <header class="navbar site-header sticky-top px-3">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <i class="bi bi-bank me-2 text-white"></i>
        <span class="brand-text">ArtAround</span>
        <span class="brand-subtitle ms-1 text-white opacity-75">Marketplace</span>
      </a>
      
      <div class="d-flex align-items-center">
        <div class="search-container me-2 position-relative d-flex align-items-center" id="search-container">
          <input type="text" id="museum-search-input" class="search-input form-control bg-transparent text-white border-0" placeholder="Cerca museo...">
          <button class="btn text-white" id="search-toggle-btn">
            <i class="bi bi-search fs-5"></i>
          </button>
        </div>

        <a href="/navigator" class="btn text-white me-3" title="Apri Navigator">
          <i class="bi bi-compass fs-5"></i>
        </a>

        <button class="btn text-white me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterSidebar">
          <i class="bi bi-funnel fs-5"></i>
        </button>

        <button class="btn text-white position-relative me-3" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
          <i class="bi bi-cart3 fs-4"></i>
          <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 0.6rem;">
            0
          </span>
        </button>

        <div id="user-area" class="text-white small d-flex align-items-center gap-2"></div>
      </div>
    </header>

    <div class="container-fluid">
      <div class="row flex-nowrap">
        <nav id="filterSidebar" class="offcanvas offcanvas-start glass-modal text-white pt-3 px-3 border-end border-secondary border-opacity-25" tabindex="-1" style="width: 300px; background: rgba(20, 20, 30, 0.95);"></nav>

        <main id="main-content" class="col px-md-4 pt-4 pb-5">
          <div class="page-header d-flex justify-content-between align-items-center pt-3 pb-4 mb-4 border-bottom">
            <h1 class="h2 page-title" id="page-title">Musei Disponibili</h1>
            <button id="back-btn" class="btn btn-sm btn-glass d-none" onclick="history.back()">
              <i class="bi bi-arrow-left me-1"></i> Indietro
            </button>
          </div>

          <div id="content-area" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
        </main>
      </div>
    </div>

    <!-- Modal Gestione Bookshop -->
    <div class="modal fade" id="bookshopManagerModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content text-bg-dark">
          <div class="modal-header border-secondary">
            <h5 class="modal-title"><i class="bi bi-box-seam me-2"></i>Gestione Magazzino Bookshop</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            
            <!-- Bottone per creare un nuovo articolo -->
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h6 class="mb-0 text-secondary">Articoli in vendita</h6>
              <button class="btn btn-sm btn-success" onclick="toggleNewItemForm()">
                <i class="bi bi-plus-lg"></i> Nuovo Articolo
              </button>
            </div>

            <!-- Form nascosto per nuovo articolo -->
            <div id="new-item-form-container" class="card bg-secondary text-white mb-4 d-none">
              <div class="card-body">
                <h6>Aggiungi Nuovo Articolo</h6>
                <form id="new-item-form">
                  <div class="row g-2">
                    <!-- Prima riga: Nome, Prezzo, Quantità -->
                    <div class="col-md-6">
                      <input type="text" id="new-item-name" class="form-control form-control-sm text-bg-dark border-secondary" placeholder="Nome (es. Tazza Girasoli)" required>
                    </div>
                    <div class="col-md-3">
                      <input type="number" step="0.01" id="new-item-price" class="form-control form-control-sm text-bg-dark border-secondary" placeholder="Prezzo (€)" required>
                    </div>
                    <div class="col-md-3">
                      <input type="number" id="new-item-qty" class="form-control form-control-sm text-bg-dark border-secondary" placeholder="Q.tà iniziale" required>
                    </div>

                    <!-- Seconda riga: Immagine e Categoria -->
                    <div class="col-md-8">
                      <input type="text" id="new-item-image" class="form-control form-control-sm text-bg-dark border-secondary" placeholder="URL Immagine (obbligatoria)" required>
                    </div>
                    <div class="col-md-4">
                      <select id="new-item-category" class="form-select form-select-sm text-bg-dark border-secondary" required>
                        <option value="" disabled selected>Categoria...</option>
                        <!-- CAMBIA QUESTI VALORI IN BASE AL TUO ENUM SU MONGOOSE -->
                        <option value="book">Libri</option>
                        <option value="gadget">Gadget</option>
                        <option value="jewlwry">Gioielleria</option>
                        <option value="stationery">Cancelleria</option>
                        <option value="clothing">Abbigliamento</option>
                        <option value="other">Altro</option>
                      </select>
                    </div>

                    <!-- Terza riga: Descrizione e Bottone -->
                    <div class="col-md-9">
                      <input type="text" id="new-item-description" class="form-control form-control-sm text-bg-dark border-secondary" placeholder="Breve descrizione dell'articolo (obbligatoria)" required>
                    </div>
                    <div class="col-md-3">
                      <button type="submit" class="btn btn-sm btn-primary w-100 h-100">Salva Articolo</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>

            <!-- Lista dinamica degli articoli esistenti -->
            <div id="bookshop-items-list" class="list-group list-group-flush">
              <!-- Popolato via JS -->
              <div class="text-center text-secondary my-3"><span class="spinner-border spinner-border-sm"></span> Caricamento...</div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <div class="offcanvas offcanvas-end glass-modal text-white" tabindex="-1" id="cartOffcanvas" style="background: rgba(20, 20, 30, 0.95);">
      <div class="offcanvas-header border-bottom border-secondary border-opacity-25">
        <h5 class="offcanvas-title"><i class="bi bi-cart3 me-2"></i>Il tuo Carrello</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body" id="cart-items-list">
        </div>
      <div class="offcanvas-footer border-top border-secondary border-opacity-25 p-3">
        <div class="d-flex justify-content-between mb-3">
          <span class="fs-5">Totale:</span>
          <span class="fs-5 fw-bold text-info" id="cart-total">€ 0.00</span>
        </div>
        <button class="btn btn-gradient w-100 py-2 fs-5" onclick="goToCheckout()">Procedi al Checkout</button>
      </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/marketplace/js/config.js"></script>
    <script src="/marketplace/js/filters.js"></script>
    <script src="/marketplace/js/personal-area.js"></script>
    <script src="/marketplace/js/marketplace.js"></script>
    <script src="/marketplace/js/sidebar.js"></script>
    <script src="/marketplace/js/cart.js"></script>
    <script src="/marketplace/js/search-bar.js"></script>
    <script src="/marketplace/js/bookshop-manager.js"></script>
  </body>
</html>
