<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>ArtAround - Accedi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/marketplace/css/style.css"/>
  <link rel="stylesheet" href="/marketplace/css/forms-style.css"/>
</head>
<body class="artaround-theme d-flex align-items-center justify-content-center" style="min-height: 100vh">
  <div class="glass-panel" style="width: 100%; max-width: 400px">
    <h2 class="aura-title text-center">Accedi</h2>

      <div id="alert-container" class="mb-3"></div>

      <a
        href="/login/federated/google"
        class="btn w-100 mb-2"
        style="
          background: #fff;
          border: 1px solid #ddd;
          color: #444;
          font-weight: 500;
        "
      >
        <img
          src="https://www.svgrepo.com/show/475656/google-color.svg"
          width="20"
          style="margin-right: 8px; vertical-align: middle"
        />
        Accedi con Google
      </a>

      <a
        href="/login/federated/github"
        class="btn w-100 mb-3"
        style="background: #24292e; color: #fff; font-weight: 500"
      >
        <img
          src="https://www.svgrepo.com/show/512317/github-142.svg"
          width="20"
          style="margin-right: 8px; vertical-align: middle; filter: invert(1);"
        />
        Accedi con GitHub
      </a>

      <div class="d-flex align-items-center mb-3">
        <hr style="flex: 1; border-color: rgba(255, 255, 255, 0.1)" />
        <span class="px-2 text-secondary small">oppure</span>
        <hr style="flex: 1; border-color: rgba(255, 255, 255, 0.1)" />
      </div>

      <form action="/login/password" method="post">
        <div class="mb-3">
          <label class="form-label-aura" for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control input-aura"
            required
          />
        </div>
        <div class="mb-4">
          <label class="form-label-aura" for="current-password">Password</label>
          <input
            type="password"
            id="current-password"
            name="password"
            class="form-control input-aura"
            autocomplete="current-password"
            required
          />
          <div class="form-check mt-2">
            <input class="form-check-input bg-secondary border-secondary shadow-none" type="checkbox" id="show-password-login" style="cursor: pointer;" onclick="togglePassword('current-password')">
            <label class="form-check-label text-secondary small" for="show-password-login" style="cursor: pointer;">
              Mostra password
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-gradient w-100">
          Entra in ArtAround
        </button>
      </form>

      <p class="text-secondary small mt-3 text-center">
        Non hai un account?
        <a href="/signup" class="text-info text-decoration-none">Registrati</a>
      </p>
    </div>

    <script src="/marketplace/js/config.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const alertContainer = document.getElementById("alert-container");

        // Controlliamo se ci sono errori di login specifici
        const loginError = urlParams.get("error");
        if (loginError) {
          let errorText = "Credenziali non valide. Riprova.";
          if (loginError === "username_not_found") {
            errorText = "L'username inserito non esiste. Registrati o verifica l'username.";
          } else if (loginError === "incorrect_password") {
            errorText = "Password non corretta. Riprova.";
          }

          alertContainer.innerHTML = `
            <div class="alert alert-danger alert-dismissible fade show border-danger" 
                style="background: rgba(220, 53, 69, 0.1); backdrop-filter: blur(5px); color: #dc3545;" 
                role="alert">
              <i class="bi bi-exclamation-octagon-fill me-2"></i>
              ${errorText}
            </div>
          `;

          // puliamo l'URL in alto senza ricaricare la pagina
          window.history.replaceState(null, "", window.location.pathname);
        }

        // Controlliamo se il login e' stato forzato per informare l'utente
        else if (urlParams.get("msg") === "login_required") {
          alertContainer.innerHTML = `
            <div class="alert alert-warning alert-dismissible fade show border-warning" 
                style="background: rgba(255, 193, 7, 0.1); backdrop-filter: blur(5px); color: #ffc107;" 
                role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              È necessario effettuare l'accesso per visualizzare quella pagina.
            </div>
          `;

          // puliamo l'URL in alto senza ricaricare la pagina
          window.history.replaceState(null, "", window.location.pathname);
        }
      });

      // Funzione per mostrare/nascondere la password
      function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
        } else {
          input.type = "password";
        }
      }
    </script>
  </body>
</html>
