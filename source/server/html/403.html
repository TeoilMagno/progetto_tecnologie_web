<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso Negato - ArtAround</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/marketplace/css/style.css">
  <link rel="stylesheet" href="/marketplace/css/403.css">
</head>
<body class="artaround-theme d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="error-card glass-panel" style="max-width: 500px; width: 100%; margin: 20px; padding: 2.5rem;">
    <div class="error-icon text-danger mb-4">
      <i class="bi bi-shield-lock" style="font-size: 5rem; display: inline-block; animation: shield-pulse 2s infinite ease-in-out;"></i>
    </div>
    <h1 class="aura-title text-center mb-3">Accesso Negato</h1>
    <p class="text-secondary mb-4 text-center">
      Non hai i permessi necessari per accedere a questa pagina. Questa funzionalità è configurata esclusivamente per gli account <strong id="required-role-text" class="text-info">Curatore</strong>.
    </p>
    
    <div class="d-grid gap-3">
      <a href="/marketplace" class="btn btn-gradient w-100 py-2 fs-5 text-center">
        <i class="bi bi-house-door me-2"></i>Torna al Marketplace
      </a>
      
      <form action="/logout" method="POST" class="m-0 d-grid">
        <input type="hidden" name="next" value="/login">
        <button type="submit" class="btn btn-glass w-100 py-2 fs-5">
          <i class="bi bi-person-x me-2"></i>Accedi con un altro account
        </button>
      </form>
    </div>
  </div>

  <script src="/marketplace/js/config.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Se l'utente ha cercato di accedere a una rotta admin, mostriamo 'Amministratore'
      if (window.location.pathname.toLowerCase().includes('admin')) {
        document.getElementById('required-role-text').innerText = 'Amministratore';
      }
    });
  </script>
</body>
</html>
