<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso Negato - ArtAround</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylsheet" href="/marketplace/css/403.css"></link>
</head>
<body>

  <div class="error-card">
    <div class="error-icon">
      <i class="bi bi-shield-lock"></i>
    </div>
    <h1 class="h3 fw-bold mb-2">Area Riservata (403)</h1>
    <p class="text-secondary mb-4">
      Non hai i permessi necessari per accedere a questa pagina. Questa funzionalità è configurata esclusivamente per gli account <strong>Curatore</strong>.
    </p>
    
    <div class="d-grid gap-2">
      <a href="/" class="btn btn-primary py-2 fw-medium">
        <i class="bi bi-shop me-2"></i>Torna al Marketplace
      </a>
      
      <form action="/logout" method="POST" class="m-0 d-grid">
        <input type="hidden" name="next" value="/login">
        <button type="submit" class="btn btn-glass py-2 fw-medium">
          <i class="bi bi-person-x me-2"></i>Accedi con un altro account
        </button>
      </form>
    </div>
  </div>

</body>
</html>
