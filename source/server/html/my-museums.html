<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - I miei Musei</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="artaround-theme">
    <header class="navbar site-header sticky-top px-3">
      <div class="d-flex align-items-center">
        <button class="btn text-white me-2 d-none" id="sidebarOpenBtn">
          <i class="bi bi-list fs-4"></i>
        </button>
        <a class="navbar-brand d-flex align-items-center" href="/">
          <i class="bi bi-bank me-2 text-white"></i>
          <span class="brand-text">ArtAround</span>
          <span class="brand-subtitle ms-1 text-white opacity-75"
            >Marketplace</span
          >
        </a>
      </div>

      <div
        id="user-area"
        class="text-white small d-flex align-items-center gap-2"
      ></div>
    </header>

    <div class="container-fluid">
      <div class="row flex-nowrap">
        <nav id="sidebar" class="sidebar min-vh-100 pt-3"></nav>

        <main id="main-content" class="col px-md-4 pt-4 pb-5">
          <div
            class="page-header d-flex justify-content-between align-items-center pt-3 pb-4 mb-4 border-bottom"
          >
            <h1 class="h2 page-title" id="page-title">I miei Musei</h1>
            <div class="d-flex gap-2">
              <a href="/" class="btn btn-sm btn-glass px-3">
                <i class="bi bi-arrow-left me-1"></i> Marketplace
              </a>
              <a href="/add-museum" class="btn btn-sm btn-gradient px-3">
                <i class="bi bi-plus-circle me-1"></i> Nuovo Museo
              </a>
            </div>
          </div>

          <div
            id="managed-museums-area"
            class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
          >
            <div class="col-12 text-center mt-5">
              <div class="spinner-border text-light" role="status"></div>
              <p class="mt-2 text-secondary">Recupero dei tuoi musei...</p>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/marketplace.js"></script>
    <script src="/js/personal-area.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        await fetchCurrentUser();
        loadManagedMuseums();
      });
    </script>
  </body>
</html>
