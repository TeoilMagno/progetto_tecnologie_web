<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - I miei Musei</title>
    <link rel="icon" type="image/svg+xml" href="/shared/img/artaround-logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"/>
    <link rel="stylesheet" href="/marketplace/css/style.css" />
  </head>
  <body class="artaround-theme">
    <header class="navbar site-header sticky-md-top px-3 flex-nowrap">
      <button class="navbar-toggler d-md-none text-white border-0 me-2 p-1 shadow-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
        <i class="bi bi-list" style="font-size: 1.8rem;"></i>
      </button>

      <button class="btn d-none back-action-btn d-md-inline-block text-white me-2">
        <i class="bi bi-arrow-left fs-4"></i>
      </button>

      <a class="navbar-brand d-flex align-items-center me-auto" href="/marketplace">
        <i class="bi bi-bank me-2 text-white"></i>
        <span class="brand-text">ArtAround</span>
        <span class="brand-subtitle ms-1 text-white opacity-75 d-none d-md-inline">I Miei Musei</span>
      </a>

      <div class="d-flex align-items-center flex-nowrap">
        <a href="/navigator" class="btn text-white me-3 d-none d-md-inline-flex" title="Apri Navigator">
          <i class="bi bi-compass fs-5"></i>
        </a>

        <div id="user-area" class="user-area text-white small d-none d-md-flex align-items-center gap-2"></div>
      </div>

      <a class="btn d-md-none back-action-btn btn-sm btn-glass rounded-pill px-3">
          <i class="bi bi-arrow-left me-1"></i> Indietro
      </a>

      <!-- Menu Mobile -->
      <div class="offcanvas-md offcanvas-start d-md-none" tabindex="-1" id="mobileMenu" style="background: rgba(20, 20, 30, 0.95); z-index: 1050;">
        <div class="offcanvas-header border-bottom border-secondary border-opacity-25">
          <h5 class="offcanvas-title text-white">Menu</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#mobileMenu"></button>
        </div>
        <div class="offcanvas-body p-4 d-flex flex-column align-items-start gap-4">
          <a href="/navigator" class="btn text-white d-flex align-items-center" title="Apri Navigator" data-bs-dismiss="offcanvas" data-bs-target="#mobileMenu">
            <i class="bi bi-compass fs-5 me-3"></i>Navigator
          </a>
          <div class="user-area text-white small d-flex flex-column align-items-start gap-3 w-100 mt-2"></div>
        </div>
      </div>
    </header>

    <div class="container-fluid">
      <div class="row flex-nowrap">
        <main id="main-content" class="col px-md-4 pt-4 pb-5">
          <div
            class="page-header d-flex justify-content-between align-items-center pt-3 pb-4 mb-4 border-bottom"
          >
            <h1 class="h2 page-title" id="page-title">I miei Musei</h1>
            <a href="/add-museum" class="btn btn-sm btn-gradient px-3">
              <i class="bi bi-plus-circle me-1"></i> Nuovo Museo
            </a>

          </div>

          <div
            id="managed-museums-area"
            class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
          >
            <div class="col-12 text-center mt-5">
              <div class="spinner-border text-light" role="status"></div>
              <p class="mt-2 text-secondary">Recupero dei tuoi musei...</p>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/marketplace/js/config.js"></script>
    <script src="/marketplace/js/sidebar.js"></script>
    <script src="/marketplace/js/my-museums.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const backBtns = document.querySelectorAll(".back-action-btn");
        backBtns.forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.preventDefault(); // Fondamentale per evitare salti pagina se usi tag <a> con href="#"
            
            if (window.history.length > 1) {
              window.history.back();
            } else {
              window.location.href = "/";
            }
          });
        });

        await fetchCurrentUser();
        loadManagedMuseums();
      });
    </script>
  </body>
</html>
