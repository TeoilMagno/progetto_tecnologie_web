<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>ArtAround - Registrati</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/marketplace/css/style.css"/>
  <link rel="stylesheet" href="/marketplace/css/forms-style.css"/>
</head>
<body class="artaround-theme d-flex align-items-center justify-content-center" style="min-height: 100vh">
  <div class="glass-panel" style="width: 100%; max-width: 400px">
    <h2 class="aura-title text-center">Registrati</h2>

    <div id="alert-container" class="mb-3"></div>

    <a href="/login/federated/google" class="btn w-100 mb-2" style="background:#fff; border:1px solid #ddd; color:#444; font-weight:500;">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" style="margin-right:8px; vertical-align:middle;">
      Registrati con Google
    </a>

    <a href="/login/federated/facebook" class="btn w-100 mb-3" style="background:#1877F2; color:#fff; font-weight:500;">
      <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" width="20" style="margin-right:8px; vertical-align:middle;">
      Registrati con Facebook
    </a>

    <div class="d-flex align-items-center mb-3">
      <hr style="flex:1; border-color: rgba(255,255,255,0.1);"><span class="px-2 text-secondary small">oppure</span><hr style="flex:1; border-color: rgba(255,255,255,0.1);">
    </div>

    <form action="/signup" method="post" id="signupForm">
      <div class="d-flex justify-content-center align-items-center mb-4 mt-2">
        <span class="text-info fw-bold small me-2 transition-all" id="label-visitor">Visitatore</span>
        <div class="form-check form-switch mb-0">
          <input class="form-check-input bg-secondary border-secondary shadow-none" type="checkbox" id="role-toggle" style="width: 3rem; height: 1.5rem; cursor: pointer;">
        </div>
        <span class="text-secondary small ms-2 transition-all" id="label-curator">Curatore</span>
      </div>
      <input type="hidden" id="requested_role" name="requested_role" value="visitor">
      <div class="mb-3">
        <label class="form-label-aura" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control input-aura" placeholder="es. mariorossi" required />
      </div>
      <div class="mb-3">
        <label class="form-label-aura" for="new-password">Password</label>
        <input type="password" id="new-password" name="password" class="form-control input-aura" placeholder="Scegli una password sicura" autocomplete="new-password" required />
      </div>
      <div class="mb-4">
        <label class="form-label-aura" for="confirm-password">Conferma password</label>
        <input type="password" id="confirm-password" name="confirm_password" class="form-control input-aura" placeholder="Ripeti la password" autocomplete="new-password" required />
      </div>
      <button type="submit" class="btn btn-gradient w-100">Registrati ad ArtAround</button>
    </form>

    <p class="text-secondary small mt-3 text-center">
      Hai già un account? <a href="/login" class="text-info text-decoration-none">Accedi</a>
    </p>
  </div>

  <script src="/marketplace/js/config.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("error") === "username_taken") {
        const alertContainer = document.getElementById("alert-container");
        alertContainer.innerHTML = `
          <div class="alert alert-danger alert-dismissible fade show border-danger" 
              style="background: rgba(220, 53, 69, 0.1); backdrop-filter: blur(5px); color: #dc3545;" 
              role="alert">
            <i class="bi bi-exclamation-octagon-fill me-2"></i>
            Questo username è già in uso. Scegline un altro.
          </div>
        `;
      }
    });

    document.getElementById('role-toggle').addEventListener('change', function(e) {
      const roleInput = document.getElementById('requested_role');
      const labelVis = document.getElementById('label-visitor');
      const labelCur = document.getElementById('label-curator');
      
      if (e.target.checked) {
        roleInput.value = 'curator';
        labelCur.className = 'text-info fw-bold small ms-2 transition-all';
        labelVis.className = 'text-secondary small me-2 transition-all';
      } else {
        roleInput.value = 'visitor';
        labelVis.className = 'text-info fw-bold small me-2 transition-all';
        labelCur.className = 'text-secondary small ms-2 transition-all';
      }
    });
    
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      const pw = document.getElementById('new-password').value;
      const pw2 = document.getElementById('confirm-password').value;
      if (pw !== pw2) {
        e.preventDefault();
        alert('Le password non coincidono.');
      }
    });
  </script>
</body>
</html>
