<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Crea Visita</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/visits.css" />
  </head>
  <body>
    <div class="container-fluid px-4"> 
      <div class="row g-4 mt-2">
        
        <div class="col-12 col-lg-8">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="h4">Catalogo Opere</h3>
            <span class="text-secondary" id="current-museum-name">Seleziona un museo...</span>
          </div>

          <div id="works-catalog-area" class="row row-cols-1 row-cols-md-2 g-3">
            <div class="p-4 border border-dashed border-secondary rounded w-100">
              <h5>Test Inserimento Opere</h5>
              <button class="btn btn-outline-light me-2 mt-2" onclick="addToVisit('id-001', 'La Gioconda')">
                  <i class="bi bi-plus"></i> Aggiungi La Gioconda
              </button>
              <button class="btn btn-outline-light me-2 mt-2" onclick="addToVisit('id-002', 'Notte Stellata')">
                  <i class="bi bi-plus"></i> Aggiungi Notte Stellata
              </button>
              <button class="btn btn-outline-light me-2 mt-2" onclick="addToVisit('id-003', 'Il David')">
                  <i class="bi bi-plus"></i> Aggiungi Il David
              </button>
            </div>
          </div>
        </div> <div class="col-12 col-lg-4">
          <div class="card custom-card sticky-top" style="top: 80px">
            <div class="card-header bg-transparent border-secondary border-opacity-25 pt-3 pb-2">
              <h5 class="mb-0"><i class="bi bi-map me-2"></i>La tua Visita</h5>
              <p class="small text-secondary mb-0 mt-1">
                Trascina l'icona <i class="bi bi-list"></i> per riordinare.
              </p>
            </div>

            <div class="card-body p-0">
              <ul id="visit-cart-list" class="list-group list-group-flush bg-transparent"></ul>

              <div id="empty-cart-msg" class="text-center p-4 text-secondary">
                <i class="bi bi-basket fs-1 mb-2 opacity-50"></i>
                <p class="small">Non hai ancora aggiunto opere alla tua visita.</p>
              </div>
            </div>

            <div class="card-footer bg-transparent border-secondary border-opacity-25 p-3">
              <button id="save-visit-btn" class="btn btn-primary w-100 rounded-pill disabled">
                Procedi e Salva
              </button>
            </div>
          </div>
        </div>

      </div>
    </div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <script src="/js/add-visit.js"></script>
  </body>
</html>
