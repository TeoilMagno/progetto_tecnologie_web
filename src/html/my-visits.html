<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtAround - Le mie visite</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="navbar sticky-top px-3">
      <div class="d-flex align-items-center">
        <button class="btn text-white me-2 d-none" id="sidebarOpenBtn">
          <i class="bi bi-list fs-4"></i>
        </button>
        <a class="navbar-brand d-flex align-items-center" href="/">
          <i class="bi bi-bank me-2 text-white"></i>
          <span class="fw-bold">ArtAround</span>
          <span class="fw-light ms-1 text-white opacity-75">Marketplace</span>
        </a>
      </div>

      <div
        id="user-area"
        class="text-white small d-flex align-items-center gap-2"
      ></div>
    </header>

    <div class="container-fluid">
      <div class="row flex-nowrap">
        <nav id="sidebar" class="sidebar min-vh-100 pt-3">
          <div class="position-sticky">
            <div
              class="px-3 mb-4 d-flex justify-content-between align-items-center"
            >
              <h6
                class="text-uppercase small fw-bold mb-0"
                style="color: var(--text-secondary); letter-spacing: 1px"
              >
                Dashboard
              </h6>
              <button
                class="btn btn-sm text-secondary p-0"
                id="sidebarCloseBtn"
              >
                <i class="bi bi-chevron-left fs-5"></i>
              </button>
            </div>
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link" href="/">
                  <i class="bi bi-house-door me-2"></i> Marketplace
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="/my-museums">
                  <i class="bi bi-bank me-2"></i> I miei Musei
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/my-visits">
                  <i class="bi bi-map me-2"></i> Le mie Visite
                </a>
              </li>
            </ul>
          </div>
        </nav>

        <main id="main-content" class="col px-md-4 pt-4 pb-5">
          <div
            class="d-flex justify-content-between align-items-center pt-3 pb-4 mb-4 border-bottom border-secondary border-opacity-25"
          >
            <h1 class="h2" id="page-title">Le mie visite</h1>
            <div class="d-flex gap-2">
              <a
                href="/"
                class="btn btn-sm btn-outline-secondary rounded-pill px-3"
              >
                <i class="bi bi-arrow-left me-1"></i> Marketplace
              </a>
              <a
                href="/create-visit"
                class="btn btn-sm btn-primary rounded-pill px-3"
              >
                <i class="bi bi-plus-circle me-1"></i> Nuova visita
              </a>
            </div>
          </div>

          <div
            id="managed-visits-area"
            class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
          >
            <div class="col-12 text-center mt-5">
              <div class="spinner-border text-info" role="status"></div>
              <p class="mt-2 text-secondary">Recupero delle tue visite...</p>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/visits-ui.js"></script>
    <script>
      // Inizializza il caricamento delle visite invece dei musei
      document.addEventListener("DOMContentLoaded", () => {
        getMyVisits(); // Questa è la funzione che hai scritto tu in visits-ui.js
      });
    </script>
  </body>
</html>
