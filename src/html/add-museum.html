<!DOCTYPE html>
<head>
  <meta charset="UTF-8" />
  <title>Art Around</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/forms-style.css" />
</head>
<body class="p-4">
  <div class="form-wrapper">
    <h1 class="aura-title">Nuovo Museo</h1>

    <form id="museumForm" class="glass-panel">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label-aura">Nome Museo</label>
          <input
            type="text"
            name="name"
            class="form-control input-aura"
            placeholder="Es: Louvre"
          />
        </div>
        <div class="col-md-6">
          <label class="form-label-aura">Indirizzo</label>
          <input
            type="text"
            name="address"
            class="form-control input-aura"
            placeholder="Via/Piazza..."
          />
        </div>
        <div class="col-md-6">
          <label class="form-label-aura">Email di Contatto</label>
          <input
            type="email"
            name="contact_email"
            class="form-control input-aura"
          />
        </div>
        <div class="col-md-6">
          <label class="form-label-aura">Telefono</label>
          <input
            type="text"
            name="contact_phone"
            class="form-control input-aura"
          />
        </div>
        <div class="col-12">
          <label class="form-label-aura">URL Immagine Museo</label>
          <input type="text" name="image" class="form-control input-aura" />
        </div>
        <div class="col-12 mb-4">
          <label class="form-label-aura">Tags (separati da virgola)</label>
          <textarea
            name="tags"
            class="form-control input-aura"
            rows="2"
          ></textarea>
        </div>
      </div>

      <div id="sections-region"></div>

      <button
        type="button"
        class="btn btn-outline-secondary w-100 mb-4"
        onclick="renderAddSection()"
      >
        <i class="bi bi-plus-lg me-2"></i>Aggiungi Sezione
      </button>

      <div
        class="d-flex gap-3 border-top border-secondary border-opacity-25 pt-4"
      >
        <button
          type="button"
          class="btn btn-primary px-5"
          onclick="museumHandleSave(event)"
        >
          Salva Museo
        </button>
        <button type="reset" class="btn btn-outline-secondary">Reset</button>
      </div>
    </form>
  </div>

  <script src="/js/add-work.js"></script>
  <script src="/js/add-section.js"></script>
  <script src="/js/add-museum.js"></script>
</body>
