<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms-style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="glass-panel" style="width: 100%; max-width: 400px;">
    <h2 class="aura-title text-center">Accedi</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label-aura">Email</label>
        <input type="email" id="email" class="form-control input-aura" required>
      </div>
      <div class="mb-4">
        <label class="form-label-aura">Password</label>
        <input type="password" id="password" class="form-control input-aura" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entra in ArtAround</button>
      <p class="text-secondary small mt-3 text-center">
        Non hai un account? <a href="/signup" class="text-info">Registrati</a>
      </p>
    </form>
  </div>
</body>
